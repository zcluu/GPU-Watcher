[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gpu-watcher"
version = "0.1.0"
description = "Elastic VRAM reservation and cooperative PyTorch launching for shared GPU servers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "zcluu" }]
keywords = ["cuda", "gpu", "nvml", "pytorch", "vram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "nvidia-ml-py>=12.0",
  "psutil>=5.9",
  "pydantic>=2.8",
  "rich>=13.7",
  "textual>=0.80",
  "tomli>=2.0",
  "tomli-w>=1.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/zcluu/GPU-Watcher"
Repository = "https://github.com/zcluu/GPU-Watcher.git"
Issues = "https://github.com/zcluu/GPU-Watcher/issues"
Documentation = "https://github.com/zcluu/GPU-Watcher#readme"
Changelog = "https://github.com/zcluu/GPU-Watcher/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
watchgpu = "watchgpu.cli:app"
watchgpu-run = "watchgpu.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchgpu"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["watchgpu"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "torch", "torch.*"]
follow_imports = "skip"
ignore_missing_imports = true
